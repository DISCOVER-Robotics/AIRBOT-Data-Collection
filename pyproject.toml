[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airbot-data-collection"
version = "0.6.6"
description = "AIRBOT Data Collection"
authors = [{ name = "OpenGHz", email = "your.email@example.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pydantic",
    "numpy",
    "more-itertools",
    "typing-extensions",
    "setproctitle",
    "mcap-data-loader ==0.0.6",
    "inflection",
]

[project.optional-dependencies]
airbot = ["ruamel.yaml"]
cv2 = ["opencv-python"]
rs = ["pyrealsense2"]
web = ["fastapi", "uvicorn"]
v4l2 = ["linuxpy", "PyTurboJPEG"]
udev = ["pyudev"]
mcap = ["mcap-data-loader ==0.0.6"]
mcap_ros1 = ["mcap-ros1-support"]
image = ["PyTurboJPEG", "av"]
# no hardware support, such as
# opencv, linuxpy, udev, pynput
# but pyav is included
soft = [
    "pydantic-settings",
    "omegaconf >=2.3.0",
    "hydra-zen",
    "transitions",
    "bidict",
    "tqdm",
    "send2trash >=1.8.3",
]
hard = [
    "pynput >=1.8.1",
    "linuxpy",
    "PyTurboJPEG",
    "pyudev",
]
ml = ["torch", "torchvision"]
plt = ["ipykernel", "holoviews"]
cfg = [
    "pydantic-settings",
    "omegaconf >=2.3.0",
    "hydra-zen",
]
basic = [
    "bidict",
    "tqdm",
    "send2trash >=1.8.3",
    "flatten-dict",
]
all = [
    "airbot-data-collection[basic]",
    "airbot-data-collection[cfg]",
    "airbot-data-collection[soft]",
    "airbot-data-collection[hard]",
    "airbot-data-collection[cv2]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["airbot_data_collection*", "airbot_ie*"]

[project.scripts]
# Primary CLI: matches project name and is easy to discover/tab-complete
airbot-data-collection = "airbot_data_collection.main:main"
# Short alias for convenience
airdc = "airbot_data_collection.main:main"
