[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airbot-data-collection"
version = "0.1.0"
description = "AIRBOT Data Collection"
authors = [
    { name="OpenGHz", email="your.email@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "omegaconf >=2.3.0",
    "hydra-core >=1.3.2",
    "transitions",
    "argdantic",
    "pydantic",
    "bidict",
    "pynput",
    "tqdm",
    "mcap",
    "flatten-dict",
]

[project.optional-dependencies]
cv2 = ["opencv-python"]
rs = ["pyrealsense2"]
web = ["fastapi", "uvicorn", "linuxpy"]
v4l2 = ["linuxpy", "PyTurboJPEG"]
udev = ["pyudev"]
all = [
    "opencv-python",
    "pyrealsense2",
    "linuxpy",
    "fastapi",
    "uvicorn",
    "PyTurboJPEG",
    "pyudev",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["airbot_data_collection*"]
