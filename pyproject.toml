[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airbot-data-collection"
version = "0.2.0"
description = "AIRBOT Data Collection"
authors = [
    { name="OpenGHz", email="your.email@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pydantic",
    "numpy",
]

[project.optional-dependencies]
cv2 = ["opencv-python"]
rs = ["pyrealsense2"]
web = ["fastapi", "uvicorn", "linuxpy"]
v4l2 = ["linuxpy", "PyTurboJPEG"]
udev = ["pyudev"]
flb = ["flatbuffers", "foxglove-schemas-flatbuffer", "av", "mcap", "flatten-dict"]
basic = [
    "argdantic",
    "omegaconf >=2.3.0",
    "hydra-core >=1.3.2",
    "transitions",
    "bidict",
    "pynput",
    "tqdm",
]
all = [
    "argdantic",
    "omegaconf >=2.3.0",
    "hydra-core >=1.3.2",
    "transitions",
    "bidict",
    "pynput",
    "tqdm",
    "opencv-python",
    # "pyrealsense2",
    "linuxpy",
    # "fastapi",
    # "uvicorn",
    "PyTurboJPEG",
    "pyudev",
    "flatbuffers",
    "foxglove-schemas-flatbuffer",
    "mcap",
    "flatten-dict",
    "av",
]
ml = [
    "torch",
    "torchvision",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["airbot_data_collection*"]
