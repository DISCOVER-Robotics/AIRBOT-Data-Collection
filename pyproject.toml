[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airbot_data_collection"
version = "0.1.0"
description = "AIRBOT Data Collection"
authors = [
    { name="OpenGHz", email="your.email@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "omegaconf >=2.3.0",
    "hydra-core >=1.3.2",
    "opencv-python >=4.9.0",
    "tqdm",
    "transitions",
    "argdantic",
    "pydantic",
    "bidict",
    "pynput",
    "pyrealsense2"
]

[tool.setuptools]
packages = ["airbot_data_collection"]
