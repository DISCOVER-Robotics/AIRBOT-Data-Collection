# @package _global_

defaults:
  - /robots: airbot_play_with_name
  # - /key_remap: example
  - /key_remap@sampler.instance.key_remap: example
  - basis

remap_module: mcap_data_loader.utils.key
key_merge:
  method:
    _target_: mcap_data_loader.utils.basic.merge_data_stamped
  pred:
    _target_: mcap_data_loader.utils.dict.PredReplaceTo
    targets: [arm]
    sources:
      - [eef]
# ros1_init:
#   _target_: airdc.common.utils.ros.ros1.init_ros_node_safe
#   name: airbot_data_collection_node

sampler:
  name: mcap_ros_sampler
  instance:
    _target_: airdc.common.samplers.mcap_sampler_ros.McapDataSamplerROS
    video_save_to: folder
    av_coder:
      non_monotonic_mode: drop
      non_monotonic_log: false

demonstrator:
  instance:
    auto_control:
      rates: [100]
      modes: [process]
    components:
      groups:
        - left
        - left
        - right
        - right
        - /
        # - /
      names:
        - lead
        - follow
        - lead
        - follow
        - env_camera
        # - base
      instances:
        - "${merge_cfg:${robots}, {port: 50050}}"
        - "${merge_cfg:${robots}, {port: 50051}}"
        # - "${merge_cfg:${robots}, {port: 50051, product_type: play, eef_types: [G2]}}"
        - "${merge_cfg:${robots}, {port: 50052}}"
        - "${merge_cfg:${robots}, {port: 50053}}"
        # - "${merge_cfg:${robots}, {port: 50053, product_type: play, eef_types: [G2]}}"
        - _target_: airdc.common.devices.cameras.mock.MockCamera
        # - _target_: airdc.common.devices.cameras.v4l2.V4L2Camera
        # - _target_: airdc.common.devices.cameras.intelrealsense.IntelRealSenseCamera
        #   camera_index: null
        #   height: 480
        #   width: 640
        #   fps: 30
        #   enable_depth: true
        #   align_depth: true
        # - _target_: airbot_ie.robots.slamtec_athena2.SlamtecAthena2
        #   blocking: true
        #   rate: 50
      roles:
        - l
        - f
        - l
        - f
        - o
        # - l

