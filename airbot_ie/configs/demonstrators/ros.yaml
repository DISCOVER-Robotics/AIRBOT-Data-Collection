sampler:
  name: airbot_mcap_sampler_ros
  instance:
    _target_: airdc.common.samplers.mcap_sampler_ros.McapDataSamplerROS
    video_save_to: folder
    av_coder:
      non_monotonic_mode: drop
      non_monotonic_log: false

demonstrator:
