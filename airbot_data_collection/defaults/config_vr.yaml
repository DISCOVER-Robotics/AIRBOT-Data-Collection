sampler:
  name: airbot_bson_sampler
  path: ""
  param:
    _target_: airbot_data_collection.airbot.datasets.AIRBOTBsonDataSampler

visualizers:
  names: [opencv]
  paths: ["", ""]
  params:
    - _target_: airbot_data_collection.airbot.visualizers.opencv.AIRBOTBsonOpenCVisualizer
      width: 640
      height: 480

managers:
  names: [self_manager, vrcontrol]
  paths: ["", ""]
  params:
    - _target_: airbot_data_collection.managers.basis.SelfManager
    - _target_: airbot_data_collection.managers.vrcontrol.VRCallbackManager
