async_save: none
auto_control:
  rate:
  - 100
components:
  groups:
  - /
  - /
  names:
  - ""
  - follow_camera
  params:
  - port: 50051
    observation:
      - interfaces:
          - joint_position
          - joint_velocity
          - joint_effort
          - pose
  - camera_index: usb-0000:00:14.0-5
    height: 480
    width: 640
  paths:
  - airbot_play
  - v4l2
  roles:
  - f
  - o
dataset:
  directory: arm1-001
managers:
  names:
  - self_manager
  - keyboard
  params:
  - _target_: airbot_data_collection.managers.basis.SelfManager
  - _target_: airbot_data_collection.managers.keyboard.KeyboardCallbackManager
  paths:
  - ''
  - ''
post_capture:
  /:
    keys:
    - eef/joint_state/position
    target_ranges:
    - 0:
      - 0
      - 0.072
sample_limit:
  size: 1000
  start_round: -1
sampler:
  name: airbot_mcap_sampler
  param:
    _target_: airbot_data_collection.airbot.samplers.mcap_sampler.AIRBOTMcapDataSampler
    task_info:
      object:
      - wooden_blocks
      - bowl
      operator: Anonymous
      scene: desktop
      skill:
      - pick
      - place
      station: ptk-001
      subtasks:
      - description: pick the wooden blocks from the bowl with the gripper
        description_zh: "\u7528\u5939\u722A\u4ECE\u7897\u4E2D\u62FE\u53D6\u6728\u5236\
          \u79EF\u6728"
        skill: pick
      task_description: do some thing
      task_id: '135'
      task_name: anonymous task
    upload:
      enabled: false
      endpoint: 192.168.215.80
      password: '123456'
      username: admin
  path: ''
update_rate: 20
visualizers:
  names:
  - opencv
  params:
  - _target_: airbot_data_collection.airbot.visualizers.opencv.AIRBOTBsonOpenCVisualizer
  paths:
  - ''
